name: Keep API warm
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you run it by hand
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 --retry 2 -o /dev/null -w "status %{http_code} in %{time_total}s\n" https://complydesk-api.onrender.com/
